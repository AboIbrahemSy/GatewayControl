name: gateway-control

services:
  bootstrap:
    image: alpine:3.23
    restart: "no"
    network_mode: none
    command:
      - /bin/sh
      - -ec
      - |
        if [ ! -s /secrets/database-password ]; then
          od -An -N24 -tx1 /dev/urandom | tr -d ' \n' > /secrets/database-password
        fi
        if [ ! -s /secrets/master-key ]; then
          od -An -N32 -tx1 /dev/urandom | tr -d ' \n' > /secrets/master-key
        fi
        chown 1000:1000 /secrets/master-key
        chmod 0400 /secrets/master-key
        chmod 0444 /secrets/database-password
        install -d -o 10001 -g 10001 -m 0755 /traefik-dynamic
    volumes:
      - gateway_secrets:/secrets
      - traefik_dynamic:/traefik-dynamic
    security_opt:
      - no-new-privileges:true

  postgres:
    image: ${POSTGRES_IMAGE:-postgres:17-alpine}
    restart: unless-stopped
    environment:
      POSTGRES_DB: gateway_control
      POSTGRES_USER: gateway_control
      POSTGRES_PASSWORD_FILE: /run/gateway-secrets/database-password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - gateway_secrets:/run/gateway-secrets:ro
    networks:
      - control
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gateway_control -d gateway_control"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

  control-plane:
    image: ${GATEWAY_CONTROL_IMAGE:-gateway-control:local}
    build:
      context: .
    restart: unless-stopped
    environment:
      DATABASE_HOST: postgres
      DATABASE_NAME: gateway_control
      DATABASE_USER: gateway_control
      DATABASE_PASSWORD_FILE: /run/gateway-secrets/database-password
      GATEWAY_CONTROL_MASTER_KEY_FILE: /run/gateway-secrets/master-key
      SESSION_COOKIE_SECURE: "true"
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-24}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      GATEWAY_AGENT_IMAGE: ${GATEWAY_AGENT_IMAGE:-gateway-control-agent:local}
      GATEWAY_TRAEFIK_DYNAMIC_VOLUME: ${GATEWAY_TRAEFIK_DYNAMIC_VOLUME:-gateway-traefik-dynamic}
    volumes:
      - gateway_secrets:/run/gateway-secrets:ro
    networks:
      - control
      - edge
    ports:
      - "${CONTROL_HTTP_PORT:-8080}:3000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

  traefik:
    image: ${TRAEFIK_IMAGE:-traefik@sha256:4299bbed850421258fc5448c2e0e6ad350981d4d335a68de11b92448aedbefe5}
    restart: unless-stopped
    command:
      - --global.checknewversion=false
      - --global.sendanonymoususage=false
      - --api.dashboard=false
      - --ping=true
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --providers.file.directory=/etc/traefik/dynamic
      - --providers.file.watch=true
      - --certificatesresolvers.letsencrypt.acme.storage=/var/lib/traefik/acme.json
      - --certificatesresolvers.letsencrypt.acme.tlschallenge=true
      - --log.format=json
      - --accesslog=true
      - --accesslog.format=json
      - --accesslog.fields.headers.defaultmode=drop
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - traefik_dynamic:/etc/traefik/dynamic:ro
      - traefik_acme:/var/lib/traefik
    networks:
      - edge
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

networks:
  control:
    internal: true
  edge:
    name: gateway-control-edge

volumes:
  postgres_data:
  gateway_secrets:
  traefik_acme:
  traefik_dynamic:
    name: ${GATEWAY_TRAEFIK_DYNAMIC_VOLUME:-gateway-traefik-dynamic}
